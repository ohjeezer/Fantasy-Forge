<body>
<main class="app-shell">
  <header class="hero">
    <p class="eyebrow">Jeezer's Game Master Toolkit</p>
    <h1>Fantasy Forge</h1>
    
  </header>

  <section class="panel">
    <div class="tabs" role="tablist" aria-label="Game system">
      <button class="tab active" type="button" data-game="dnd">D&amp;D</button>
      <button class="tab" type="button" data-game="utilities">Utilities</button>
    </div>

    <div id="generatorTabs" class="generator-tabs" role="tablist" aria-label="Generators"></div>
    <div class="sheet-shortcut-row"><button id="openCharacterSheet" class="sheet-shortcut" type="button">Open Character Sheet</button></div>
    <div class="panel-body">
      <label class="field generator-select-fallback">
        <span>Generator</span>
        <select id="generatorType"></select>
      </label>

      <div id="controls" class="controls"></div>
      <div class="generator-action-row">
        <button id="generateAll" class="primary-button" type="button">Generate all</button>
        <button id="lockAllButton" class="secondary-button" type="button">Lock all</button>
        <button id="unlockAllButton" class="secondary-button" type="button">Unlock all</button>
      </div>

      <section class="result-card" aria-live="polite">
        <div class="result-head">
          <h2 id="resultTitle">Result</h2>
          <div class="result-actions">
            <button id="copyButton" class="secondary-button" type="button">Copy</button>
            <button id="favoriteButton" class="secondary-button" type="button">Add favorite</button>
            <button id="addSheetButton" class="secondary-button" type="button" hidden>Add to Character Sheet</button>
          </div>
        </div>
        <div id="statusMessage" aria-live="polite"></div><div id="resultFields" class="result-grid"></div>
      </section>
    </div>
  </section>

  <section class="panel favorites-panel">
    <div class="section-heading">
      <div><p class="eyebrow">Saved locally</p><h2>Favorites</h2></div>
      <button id="clearFavorites" class="text-button" type="button">Clear all</button>
    </div>
    <ul id="favoritesList" class="favorites-list"></ul>
    <p id="emptyFavorites" class="empty-state">No favorites saved for this generator.</p>
  </section>

  <footer>Runs entirely in your browser. No generated information is uploaded.</footer>
</main>

  function transformedName(system, seed, race, style) {
    if (!seed.trim()) return raceName(race, system);
    const table = system === "dnd" ? DATA.dndNames : DATA.skyrimNames;
    const flavor = pick(table[race][0]);
    const surname = pick(table[race][1]);
    const words = seed.trim().split(/\s+/);
    return words.map((word,index) => {
      const size = style === "Short" ? 3 : style === "Epic" ? 5 : 4;
      return index === 0 ? `${flavor.slice(0,3)}${word.slice(0,size)}` : `${word.slice(0,size)}${surname.slice(-3)}`;
    }).join(" ");
  }

    if(target==="Support Characters"){supportCharacters.splice(index,1);if(supportCharacters.length)characterSheet[target]=supportCharacters.map((p,i)=>`${i+1}. ${p.Name} • ${p.Race||"Unknown race"} • ${p.Class||p.Profession||"Support"}`).join("\n");else delete characterSheet[target];}
    else if(target==="Weapons"){sheetWeapons.splice(index,1);if(sheetWeapons.length)characterSheet[target]=sheetWeapons.map((x,i)=>`${i+1}. ${x.Name} (${x.Type||"Weapon"})`).join("\n");else delete characterSheet[target];}
    else if(target==="Magic Items"){sheetItems.splice(index,1);if(sheetItems.length)characterSheet[target]=sheetItems.map((x,i)=>`${i+1}. ${x.Name} (${x.Type||"Item"})`).join("\n");else delete characterSheet[target];}
    else{delete characterSheet[target];delete sheetLinks[target];}
    result={...characterSheet};render();
  }
  function createBackstoryFromName(){if(game!=="dnd")return;saveCurrentFavorite();pendingBackstory={Name:result.Name,Race:result.Race,Class:result.Class};byId("generatorType").value="Backstory";generator="Backstory";buildControls();generateAll();window.scrollTo({top:0,behavior:"smooth"});}
  function resultText(){return [byId("resultTitle").textContent,...Object.entries(result).map(([k,v])=>`\n${k.toUpperCase()}\n${v}`)].join("\n");}
  function storageKey(){return `forge:${game}:${generator}`;}
  function saved(){try{return JSON.parse(localStorage.getItem(storageKey())||"[]")}catch{return[];}}
  function favoritePayload(){const p={text:resultText(),generator,result:{...result}};if(generator==="Quest")p.npcs=questGiverNpc?[questGiverNpc]:[];if(generator==="Place")p.npcs=[placeOwnerNpc,...placeWorkerNpcs].filter(Boolean);return p;}
  function renderFavorites(){const list=saved();byId("favoritesList").innerHTML=list.map((raw,index)=>{const item=typeof raw==="string"?{text:raw,npcs:[]}:raw;const buttons=(item.npcs||[]).map((p,i)=>`<button class="favorite-open" data-fav-npc="${index}:${i}">Generate NPC: ${p.Name}</button>`).join("");return `<li class="favorite-item"><div><button class="favorite-restore" data-restore="${index}">Load favorite into generator</button><pre>${item.text}</pre>${buttons?`<div class="favorite-actions">${buttons}</div>`:""}</div><button class="remove" data-remove="${index}">Remove</button></li>`;}).join("");byId("emptyFavorites").hidden=list.length>0;document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{const a=saved();a.splice(+b.dataset.remove,1);localStorage.setItem(storageKey(),JSON.stringify(a));renderFavorites();});document.querySelectorAll("[data-restore]").forEach(b=>b.onclick=()=>{const item=saved()[+b.dataset.restore];if(item&&typeof item==="object"&&item.result){result=JSON.parse(JSON.stringify(item.result));resultCache.set(cacheKey(),result);buildControls();if(byId("raceInput")&&result.Race)byId("raceInput").value=result.Race;if(byId("classInput")&&result.Class)byId("classInput").value=result.Class;if(byId("roleInput")&&result[roleLabel()])byId("roleInput").value=result[roleLabel()];if(byId("placeType")&&result.Type)byId("placeType").value=result.Type;if(byId("weaponType")&&result.Type)byId("weaponType").value=result.Type;if(byId("itemType")&&result.Type)byId("itemType").value=result.Type;render();}});document.querySelectorAll("[data-fav-npc]").forEach(b=>b.onclick=()=>{const [fi,ni]=b.dataset.favNpc.split(":").map(Number),item=saved()[fi];if(item&&item.npcs&&item.npcs[ni])openNpc(item.npcs[ni]);});}
  function render(){updateSheetActionButton();resultCache.set(cacheKey(),JSON.parse(JSON.stringify(result)));byId("resultTitle").textContent=result.Name||generator;byId("resultFields").innerHTML=Object.entries(result).map(([key,value])=>{let action="";if(generator==="Quest"&&key==="Quest giver")action=`<button class="secondary-button npc-link" data-open-quest-npc>Generate NPC</button>`;if(generator==="Place"&&key==="Owner")action=`<button class="secondary-button npc-link" data-open-owner-npc>Generate owner NPC</button>`;if(generator==="Place"&&key==="Workers")action=placeWorkerNpcs.map((p,i)=>`<button class="secondary-button npc-link" data-open-worker="${i}">Generate ${p.Name}</button>`).join(" ");if(generator==="Character Name"&&key==="Seed")action+=`<button class="secondary-button npc-link" data-clear-output-seed>Clear seed</button>`;if(generator==="Character Library"&&key.startsWith("Record ")){const idx=Number(key.split(" ")[1])-1,entry=loadCharacterLibrary()[idx];if(entry)action+=`<span class="sheet-record-actions"><button class="secondary-button npc-link" data-library-open="${idx}">Open ${entry.data.Name||"record"}</button><button class="remove-record" data-library-remove="${idx}">Remove</button></span>`;}if(generator==="Character Sheet"){if(key==="Support Characters")action+=supportCharacters.map((p,i)=>`<span class="sheet-record-actions"><button class="secondary-button npc-link" data-sheet-open="Support Characters:${i}">Open ${p.Name}</button><button class="remove-record" data-sheet-remove="Support Characters:${i}">Remove</button></span>`).join("");else if(key==="Weapons")action+=sheetWeapons.map((x,i)=>`<span class="sheet-record-actions"><button class="secondary-button npc-link" data-sheet-open="Weapons:${i}">Open ${x.Name}</button><button class="remove-record" data-sheet-remove="Weapons:${i}">Remove</button></span>`).join("");else if(key==="Magic Items")action+=sheetItems.map((x,i)=>`<span class="sheet-record-actions"><button class="secondary-button npc-link" data-sheet-open="Magic Items:${i}">Open ${x.Name}</button><button class="remove-record" data-sheet-remove="Magic Items:${i}">Remove</button></span>`).join("");else if(sheetLinks[key])action+=`<span class="sheet-record-actions"><button class="secondary-button npc-link" data-sheet-open="${key}">Open ${sheetLinks[key].generator}</button><button class="remove-record" data-sheet-remove="${key}">Remove</button></span>`;}const activeLocks=locksFor();const lock=activeLocks?`<button class="lock-button ${activeLocks.has(key)?"locked":""}" data-lock="${key}">${activeLocks.has(key)?"Locked":"Lock"}</button>`:"";return `<div class="result-field ${String(value).length>65?"full":""} ${"has-lock"}"><span class="result-label">${key}</span><div class="result-value">${value}</div>${key==="Style"?"":`<button class="reroll" data-key="${key}">↻</button>`}${lock}${action}</div>`;}).join("");document.querySelectorAll("[data-create-backstory]").forEach(b=>b.onclick=createBackstoryFromName);document.querySelectorAll("[data-add-sheet]").forEach(b=>b.onclick=addCurrentToCharacterSheet);document.querySelectorAll("[data-sheet-open]").forEach(b=>b.onclick=()=>{const [target,index]=b.dataset.sheetOpen.split(":");openSheetRecord(target,index===undefined?null:+index);});document.querySelectorAll("[data-sheet-remove]").forEach(b=>b.onclick=()=>{const [target,index]=b.dataset.sheetRemove.split(":");removeSheetRecord(target,index===undefined?null:+index);});document.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>rerollField(b.dataset.key));document.querySelectorAll("[data-lock]").forEach(b=>b.onclick=()=>{const s=locksFor();s.has(b.dataset.lock)?s.delete(b.dataset.lock):s.add(b.dataset.lock);render();});const cs=document.querySelector("[data-clear-output-seed]");if(cs)cs.onclick=()=>{if(locksFor().has("Seed"))return;seedText="";result.Seed="Race-generated";const i=byId("seedInput");if(i)i.value="";render();};const qb=document.querySelector("[data-open-quest-npc]");if(qb)qb.onclick=()=>openNpc(questGiverNpc);const ob=document.querySelector("[data-open-owner-npc]");if(ob)ob.onclick=()=>openNpc(placeOwnerNpc);document.querySelectorAll("[data-open-worker]").forEach(b=>b.onclick=()=>openNpc(placeWorkerNpcs[+b.dataset.openWorker]));document.querySelectorAll("[data-library-open]").forEach(b=>b.onclick=()=>{const entry=loadCharacterLibrary()[+b.dataset.libraryOpen];if(!entry)return;const target=entry.kind==="Character"?"Full Character Stats":entry.kind==="NPC"?"NPC Stats":"Enemy & Monster";showGenerator(target,false);result=JSON.parse(JSON.stringify(entry.data));render();});document.querySelectorAll("[data-library-remove]").forEach(b=>b.onclick=()=>{const list=loadCharacterLibrary();list.splice(+b.dataset.libraryRemove,1);saveCharacterLibrary(list);resultCache.delete("dnd:Character Library");result=libraryResult();render();});renderFavorites();}

  function updateSheetActionButton(){
    const button=byId("addSheetButton");
    if(!button)return;
    const labels={
      "Character Builder":result.Mode==="Support NPC"?"Add as NPC":"Add character",
      "Weapon":"Add weapon",
      "Magic Item":"Add item",
      "Quest":"Add quest",
      "Place":"Add home",
      "Party Name":"Add party",
      "Character Sheet":"Open full stats",
      "Full Character Stats":"Save to library",
      "NPC Stats":"Save NPC to library",
      "Enemy & Monster":"Save enemy to library"
    };
    button.hidden=game!=="dnd"||!labels[generator];
    button.textContent=labels[generator]||"Add to Character Sheet";
  }
  function lockAllFields(){
    const locks=locksFor();
    Object.keys(result).forEach(key=>locks.add(key));
    render();
  }
  function unlockAllFields(){
    locksFor().clear();
    render();
  }
  function renderGeneratorTabs(){
    const bar=byId("generatorTabs");if(!bar)return;
    bar.innerHTML=generatorMap[game].map(name=>`<button type="button" class="generator-tab ${name===generator?"active":""}" data-generator="${name}">${name}</button>`).join("");
    bar.querySelectorAll("[data-generator]").forEach(button=>button.onclick=()=>showGenerator(button.dataset.generator));
    const sheet=byId("openCharacterSheet");if(sheet)sheet.hidden=game!=="dnd";
  }
  function showGenerator(next,createIfMissing=true){
    if(result&&Object.keys(result).length)resultCache.set(cacheKey(),JSON.parse(JSON.stringify(result)));
    generator=next;byId("generatorType").value=generator;renderGeneratorTabs();buildControls();const action=byId("generateAll");if(action)action.textContent=generator==="Card Pull"?"Pull":generator==="Dice Roller"?"Roll":generator==="Number Picker"?"Pick":generator==="Character Sheet"?"Generate Full Character":"Generate all";
    const generateButton=byId("generateAll");if(generateButton)generateButton.hidden=generator==="Character Library";
    if(generator==="Character Library"){result=libraryResult();resultCache.set(cacheKey(),JSON.parse(JSON.stringify(result)));render();return;}
    const cached=resultCache.get(cacheKey());
    if(cached){result=JSON.parse(JSON.stringify(cached));render();}
    else if(createIfMissing)generateAll();
  }
  function populateGenerators(){
    byId("generatorType").innerHTML=options(generatorMap[game]);
    renderGeneratorTabs();
    showGenerator(generatorMap[game][0]);
  }

  document.querySelectorAll(".tab").forEach(button=>button.addEventListener("click",()=>{
    if(result&&Object.keys(result).length)resultCache.set(cacheKey(),JSON.parse(JSON.stringify(result)));
    game = button.dataset.game;
    document.querySelectorAll(".tab").forEach(tab=>tab.classList.toggle("active",tab===button));
    populateGenerators();
  }));
  byId("generatorType").addEventListener("change",()=>showGenerator(byId("generatorType").value));
  byId("openCharacterSheet").addEventListener("click",()=>{if(game!=="dnd"){game="dnd";document.querySelectorAll(".tab").forEach(tab=>tab.classList.toggle("active",tab.dataset.game==="dnd"));byId("generatorType").innerHTML=options(generatorMap.dnd);}showGenerator("Character Sheet");});
  byId("generateAll").addEventListener("click",generateAll);
  byId("lockAllButton").addEventListener("click",lockAllFields);
  byId("unlockAllButton").addEventListener("click",unlockAllFields);
  byId("addSheetButton").addEventListener("click",()=>{
    if(generator==="Character Sheet"){showGenerator("Full Character Stats");return;}
    if(["Full Character Stats","NPC Stats","Enemy & Monster"].includes(generator)){
      const kind=generator==="Full Character Stats"?"Character":generator==="NPC Stats"?"NPC":"Enemy";
      const list=loadCharacterLibrary();list.unshift(libraryEntryFromResult(kind));saveCharacterLibrary(list);resultCache.delete("dnd:Character Library");const status=byId("statusMessage");if(status){status.textContent="Saved to Character Library";setTimeout(()=>{if(status.textContent==="Saved to Character Library")status.textContent=""},2200);}if(generator==="Character Library")result=libraryResult();render();return;
    }
    addCurrentToCharacterSheet();
  });
  byId("copyButton").addEventListener("click",async()=>navigator.clipboard.writeText(resultText()));
  byId("favoriteButton").addEventListener("click",()=>{saveCurrentFavorite();renderFavorites();});
  byId("clearFavorites").addEventListener("click",()=>{localStorage.removeItem(storageKey());renderFavorites();});

  populateGenerators();
});

</script></body>
</html>
