<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17130f"><title>Fantasy Generator Toolkit</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app-shell"><header class="hero"><p class="eyebrow">Game Master Toolkit</p><h1>Fantasy Generator Toolkit</h1><p>Create names, characters, quests, places, parties, and Skyrim weapons. Reroll individual fields or copy a clean character-sheet-style output.</p></header>
<nav class="game-tabs" aria-label="Game"><button class="game-tab active" data-game="dnd">D&amp;D</button><button class="game-tab" data-game="skyrim">Skyrim</button></nav>
<section id="dnd" class="game-panel active"><nav class="tool-tabs" aria-label="D&D generators">
<button class="tool-tab active" data-tool="dnd-name">Character Name</button><button class="tool-tab" data-tool="backstory">Backstory</button><button class="tool-tab" data-tool="quest">Quest</button><button class="tool-tab" data-tool="place">Place</button><button class="tool-tab" data-tool="party">Party Name</button><button class="tool-tab" data-tool="npc">NPC</button><button class="tool-tab" data-tool="dnd-weapon">Weapon</button><button class="tool-tab" data-tool="dnd-item">Magic Item</button></nav>
<div id="dnd-name" class="tool-panel active"></div><div id="backstory" class="tool-panel"></div><div id="quest" class="tool-panel"></div><div id="place" class="tool-panel"></div><div id="party" class="tool-panel"></div><div id="npc" class="tool-panel"></div><div id="dnd-weapon" class="tool-panel"></div><div id="dnd-item" class="tool-panel"></div></section>
<section id="skyrim" class="game-panel"><nav class="tool-tabs" aria-label="Skyrim generators"><button class="tool-tab active" data-tool="skyrim-name">Character Name</button><button class="tool-tab" data-tool="weapon">Weapon Name</button></nav><div id="skyrim-name" class="tool-panel active"></div><div id="weapon" class="tool-panel"></div></section>
<footer>Everything runs locally in your browser. Generated content is not uploaded.</footer></main><script src="script.js"></script></body></html>
