<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17130f"><title>Fantasy Name Forge Toolkit</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell"><header class="hero"><p class="eyebrow">Game Master Toolkit</p><h1>Fantasy Name Forge</h1><p class="subtitle">Names, characters, quests, places, parties, weapons, and items in one stable generator panel.</p></header><section class="panel"><div class="tabs"><button class="tab active" data-game="dnd">D&amp;D</button><button class="tab" data-game="skyrim">Skyrim</button></div><div class="panel-body"><label class="field"><span>Generator</span><select id="generatorType"></select></label><div id="controls" class="controls"></div><button id="generateAll" class="primary-button">Generate all</button><section class="result-card"><div class="result-head"><h2 id="resultTitle">Result</h2><div><button id="copyButton" class="secondary-button">Copy</button><button id="favoriteButton" class="secondary-button">Add favorite</button></div></div><div id="resultFields" class="result-grid"></div></section></div></section><section class="panel favorites-panel"><div class="section-heading"><div><p class="eyebrow">Saved locally</p><h2>Favorites</h2></div><button id="clearFavorites" class="text-button">Clear all</button></div><ul id="favoritesList" class="favorites-list"></ul><p id="emptyFavorites" class="empty-state">No favorites saved for this generator.</p></section><footer>Runs entirely in your browser. No generated information is uploaded.</footer></main><script src="script.js"></script></body></html>
